{% extends "base.html" %}

{% block title %}
    Задачи - Трекер домашних задач
{% endblock %}

{% block content %}
    <h1>Задачи</h1>

    <p>
        Всего задач: {{ tasks|length }}
    </p>

    {% for task in tasks %}
        {% include "task_pages/includes/task_card.html" %}
    {% empty %}
        <p>Задачи не найдены.</p>
    {% endfor %}
{% endblock %}
